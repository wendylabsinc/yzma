name: Browser ONNX inference
on:
  push:
    branches: [wendy/browser-onnx]
  pull_request:
    paths: ['wasm/onnx/**', 'package*.json', '.github/workflows/browser-onnx.yml']
jobs:
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
